<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2F4370"><link rel="manifest" href="/manifest.json"><title>Vocab Flow</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1b2430;--muted:#647181;--accent:#2f4370;--ok:#568466;--bad:#c4634f;--line:#dbe1e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{padding:28px 20px 12px;max-width:720px;margin:auto}h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:var(--muted);font-size:13px}.auth{background:var(--card);padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.auth input{flex:1;min-width:210px}.tabs{display:flex;gap:8px;max-width:720px;margin:auto;padding:10px 20px}.tab,.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.tab{flex:1;color:var(--muted)}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}main{max-width:720px;margin:auto;padding:0 20px 48px}.view{display:none}.view.active{display:block}.panel,.item,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}.label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;font:inherit;background:white}textarea{min-height:80px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:var(--bad)}.muted{color:var(--muted);font-size:13px}.meaning{line-height:1.65;margin-top:10px}.meaning-line{padding:8px 0;border-bottom:1px solid #edf0f3}.meaning-line:last-child{border-bottom:0}.word{font-size:21px;font-weight:800}.badge{font-size:11px;border-radius:99px;background:#edf1f7;color:var(--accent);padding:4px 8px}.item-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.empty{text-align:center;color:var(--muted);padding:48px 10px;line-height:1.8}.card-stage{text-align:center}.flash{min-height:260px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer}.flash .word{font-size:34px}.controls{display:flex;gap:8px}.controls .btn{flex:1;color:#fff;border:0}.known{background:var(--ok)}.unknown{background:var(--bad)}.hidden{display:none!important}.small{font-size:12px}.toast{position:fixed;bottom:20px;left:20px;right:20px;background:#1b2430;color:#fff;border-radius:10px;padding:12px;text-align:center;z-index:5}
</style></head><body>
<header><h1>Vocab Flow</h1><p>出会った英単語を、意味ごと保存して復習</p></header>
<section class="auth"><span id="auth-status" class="muted">ログインしてください</span><input id="email" type="email" placeholder="メールアドレス"><button id="login-btn" class="btn primary">確認コードを送る</button><button id="logout-btn" class="btn hidden">ログアウト</button></section>
<nav class="tabs"><button class="tab active" data-view="register">登録</button><button class="tab" data-view="history">検索履歴</button><button class="tab" data-view="review">復習</button></nav>
<main>
<section id="view-register" class="view active"><div class="panel"><h2>単語を調べる</h2><p class="muted">意味を確認してから、必要な単語だけ登録できます。</p><input id="word-input" placeholder="例：awkward"><button id="lookup-btn" class="btn primary" style="width:100%;margin-top:10px">意味を調べる</button><div id="lookup-result"></div></div></section>
<section id="view-history" class="view"><div class="panel"><div class="row"><input id="history-filter" placeholder="履歴を検索"><button id="reload-history" class="btn">更新</button></div></div><div id="history-container"></div></section>
<section id="view-review" class="view"><div id="review-container" class="card-stage"></div></section>
</main><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let sb, session=null, words=[], history=[], sources=[], queue=[], qi=0, lookup=null;
const $=id=>document.getElementById(id), api=(path,opt={})=>fetch(path,{...opt,headers:{'Content-Type':'application/json',...(session?{Authorization:'Bearer '+session.access_token}:{}) ,...(opt.headers||{})}});
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function boot(){const cfg=await (await fetch('/api/config')).json();sb=window.supabase.createClient(cfg.url,cfg.key);const r=await sb.auth.getSession();session=r.data.session;sb.auth.onAuthStateChange((_e,s)=>{session=s;renderAuth();if(s) loadAll()});renderAuth();if(session)loadAll()}
function renderAuth(){const on=!!session;$('auth-status').textContent=on?session.user.email+' でログイン中':'ログインしてください';$('email').classList.toggle('hidden',on);$('login-btn').classList.toggle('hidden',on);$('logout-btn').classList.toggle('hidden',!on)}
$('login-btn').onclick=async()=>{const email=$('email').value.trim();if(!email)return toast('メールアドレスを入力してください');const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin}});toast(error?error.message:'確認リンクをメールに送りました')};$('logout-btn').onclick=()=>sb.auth.signOut();
async function loadAll(){const wr=await api('/api/words');if(wr.ok)words=(await wr.json()).words||[];const hr=await api('/api/history');if(hr.ok)history=(await hr.json()).history||[];const sr=await api('/api/source-types');if(sr.ok)sources=(await sr.json()).source_types||[];renderHistory();buildQueue();renderReview()}
$('lookup-btn').onclick=async()=>{if(!session)return toast('先にログインしてください');const word=$('word-input').value.trim();if(!word)return toast('単語を入力してください');$('lookup-result').innerHTML='<div class="panel">検索中...</div>';const r=await fetch('/api/lookup?word='+encodeURIComponent(word));const data=await r.json();if(!r.ok)return $('lookup-result').innerHTML='<div class="panel">'+esc(data.error||'検索に失敗しました')+'</div>';lookup=data;await api('/api/history',{method:'POST',body:JSON.stringify({word:data.word,meanings:data.meanings,example_sentence:data.example_sentence})}).then(async x=>{if(x.ok){const j=await x.json();history.unshift(j.history);renderHistory()}});renderLookup()};
function renderLookup(){const d=lookup;const meanings=(d.meanings||[]).map(m=>'<div class="meaning-line"><b>'+esc(m.label)+'</b> '+esc(m.text)+(m.example?'<div class="muted">例：'+esc(m.example)+'</div>':'')+'</div>').join('');$('lookup-result').innerHTML='<div class="panel"><div class="word">'+esc(d.word)+'</div><div class="meaning">'+(meanings||'意味が見つかりませんでした。手入力で登録できます。')+'</div>'+registerForm()+'</div>';$('add-source').onclick=addSource;$('save-word').onclick=()=>saveWord(d)}
function registerForm(){const opts=sources.map(s=>'<option value="'+esc(s.name)+'">'+esc(s.name)+'</option>').join('');return '<div class="label">出典タイプ</div><div class="row"><select id="source-type">'+opts+'</select><button class="btn" id="add-source">新規追加</button></div><div class="label">動画・曲・作品名（任意）</div><input id="source-title" placeholder="例：Friends S1E1"><div class="label">URL（任意）</div><input id="source-url" placeholder="https://..."><div class="label">メモ（任意）</div><textarea id="note" placeholder="出会った場面や自分のメモ"></textarea><button class="btn primary" id="save-word" style="width:100%;margin-top:10px">この意味を単語帳に登録</button><div id="source-msg" class="small muted"></div>'}
async function addSource(){const name=prompt('追加する出典タイプ');if(!name)return;const r=await api('/api/source-types',{method:'POST',body:JSON.stringify({name})});if(!r.ok)return toast('追加できませんでした');const j=await r.json();sources.push(j.source_type);renderLookup();toast('出典タイプを追加しました')}
async function saveWord(d,hid){const meaning=(d.meanings||[]).map(m=>m.label+': '+m.text).join('\n');const r=await api('/api/add-word',{method:'POST',body:JSON.stringify({word:d.word,meaning,example_sentence:d.example_sentence,source_type:$('source-type').value,source_title:$('source-title').value,source_url:$('source-url').value,note:$('note').value,history_id:hid})});if(!r.ok)return toast((await r.json()).error||'登録に失敗しました');toast('登録しました。復習タブで復習できます');await loadAll()}
function renderHistory(){const q=$('history-filter').value.toLowerCase();const list=history.filter(h=>h.word.toLowerCase().includes(q));$('history-container').innerHTML=list.length?list.map(h=>'<div class="item"><div class="item-head"><span class="word">'+esc(h.word)+'</span><span class="badge">'+(h.registered_word_id?'登録済み':'未登録')+'</span></div><div class="meaning">'+(h.meanings||[]).map(m=>'<div class="meaning-line">'+esc(m.label)+': '+esc(m.text)+'</div>').join('')+'</div>'+(!h.registered_word_id?'<button class="btn primary history-register" data-id="'+h.id+'">この履歴から登録</button>':'')+'</div>').join(''):'<div class="empty">検索履歴はありません。</div>';document.querySelectorAll('.history-register').forEach(b=>b.onclick=()=>{const h=history.find(x=>x.id===b.dataset.id);lookup={word:h.word,meanings:h.meanings||[],example_sentence:h.example_sentence||''};showView('register');renderLookup()})}
$('history-filter').oninput=renderHistory;$('reload-history').onclick=loadAll;
function buildQueue(){queue=words.filter(w=>!w.next_review||new Date(w.next_review)<=new Date());qi=0}function renderReview(){const c=$('review-container');if(!session)return c.innerHTML='<div class="empty">ログインすると復習できます。</div>';if(!queue.length)return c.innerHTML='<div class="empty">今日の復習はありません。<br><span class="muted">次回復習日になると自動でここに戻ります。</span></div>';if(qi>=queue.length)return c.innerHTML='<div class="empty">今日の復習は完了です。</div>';const w=queue[qi];c.innerHTML='<div class="card flash" id="flash"><div class="muted">タップして意味を表示</div><div class="word">'+esc(w.word)+'</div><div id="answer" class="meaning hidden">'+esc(w.meaning)+'</div></div><div class="controls"><button class="btn unknown" id="u">わからない</button><button class="btn known" id="k">覚えた</button></div><p class="muted">'+(qi+1)+' / '+queue.length+'</p>';$('flash').onclick=()=>$('answer').classList.toggle('hidden');$('u').onclick=()=>review(w.id,false);$('k').onclick=()=>review(w.id,true)}async function review(id,known){const r=await api('/api/review',{method:'POST',body:JSON.stringify({id,known})});if(!r.ok)return toast('復習結果を保存できませんでした');qi++;await loadAll()}
function showView(v){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));if(v==='review'){buildQueue();renderReview()}}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.view));
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');boot();
</script></body></html>
